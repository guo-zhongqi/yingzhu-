<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>莹烛电商知识库</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172126;
      --muted: #64727a;
      --line: #d8e1e5;
      --soft: #eef4f2;
      --paper: #f7f8f5;
      --panel: #ffffff;
      --brand: #0f766e;
      --brand-strong: #0a5f58;
      --gold: #b7791f;
      --red: #b42318;
      --shadow: 0 18px 44px rgba(23, 33, 38, .12);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(120deg, rgba(15, 118, 110, .12), transparent 30%),
        linear-gradient(300deg, rgba(183, 121, 31, .12), transparent 32%),
        var(--paper);
      color: var(--ink);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 24px;
      color: #f7fbfa;
      background: #102421;
    }

    .brand {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }

    .mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(135deg, #12a594, #d89427);
      font-weight: 900;
      color: #fff;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 4px;
      font-size: 21px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .brand p, .aside-note {
      margin-bottom: 0;
      color: #b7c8c4;
      font-size: 13px;
      line-height: 1.55;
    }

    .aside-note {
      padding: 13px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      margin: 18px 0;
    }

    nav {
      display: grid;
      gap: 8px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: #dce8e5;
      text-align: left;
    }

    .nav-btn:hover, .nav-btn.active {
      background: rgba(255,255,255,.12);
      color: #fff;
    }

    .nav-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: rgba(255,255,255,.13);
      font-weight: 800;
      font-size: 13px;
    }

    .nav-title {
      display: block;
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-meta {
      display: block;
      margin-top: 2px;
      color: #aac0bb;
      font-size: 12px;
    }

    .count-pill {
      min-width: 28px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      color: #eaf4f1;
      font-size: 12px;
      font-weight: 800;
    }

    main {
      min-width: 0;
      padding: 24px;
    }

    .search-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(216,225,229,.9);
      border-radius: 8px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 12px 30px rgba(23, 33, 38, .08);
      backdrop-filter: blur(12px);
    }

    .search-field {
      position: relative;
    }

    .search-field span {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 900;
    }

    #searchInput {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px 0 42px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    #searchInput:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15,118,110,.14);
    }

    .result-count {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .icon-btn, .primary-btn, .text-btn {
      min-height: 40px;
      border-radius: 8px;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      white-space: nowrap;
    }

    .icon-btn {
      width: 40px;
      padding: 0;
      background: #e7f2ef;
      color: var(--brand-strong);
      font-size: 18px;
    }

    .primary-btn {
      padding: 0 14px;
      background: var(--brand);
      color: #fff;
    }

    .text-btn {
      padding: 0 12px;
      background: #eef4f2;
      color: var(--brand-strong);
    }

    .download-btn {
      min-height: 42px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      margin: 14px 0;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      font-weight: 900;
    }

    .file-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 14px 0;
    }

    .download-btn:hover {
      background: var(--brand-strong);
    }

    .view-btn {
      min-height: 42px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      background: #e7f2ef;
      color: var(--brand-strong);
      text-decoration: none;
      font-weight: 900;
    }

    .view-btn:hover {
      background: #d9ebe7;
    }

    .record-action {
      margin-top: 12px;
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 0 14px;
      background: #e7f2ef;
      color: var(--brand-strong);
      font-size: 13px;
      font-weight: 900;
    }

    .primary-btn:hover { background: var(--brand-strong); }
    .icon-btn:hover, .text-btn:hover { background: #d9ebe7; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .intro, .side-panel, .detail-panel, .result-panel, .module-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.94);
      box-shadow: var(--shadow);
    }

    .intro {
      padding: 28px;
      min-height: 220px;
      display: grid;
      align-content: center;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--brand-strong);
      font-size: 13px;
      font-weight: 900;
    }

    h2 {
      margin-bottom: 12px;
      font-size: clamp(30px, 4.2vw, 48px);
      line-height: 1.06;
      letter-spacing: 0;
    }

    .intro p {
      max-width: 760px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .side-panel {
      padding: 18px;
      display: grid;
      align-content: space-between;
      gap: 18px;
      background:
        linear-gradient(135deg, rgba(15,118,110,.14), transparent 45%),
        linear-gradient(315deg, rgba(183,121,31,.13), transparent 44%),
        #fff;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      padding: 12px;
      border-radius: 8px;
      background: rgba(255,255,255,.82);
      border: 1px solid #e4ecef;
    }

    .metric strong {
      display: block;
      margin-bottom: 4px;
      color: var(--brand-strong);
      font-size: 24px;
      line-height: 1;
    }

    .metric span {
      color: #516168;
      font-size: 12px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: start;
    }

    .content-view {
      min-width: 0;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .module-card {
      padding: 18px;
      box-shadow: none;
      display: grid;
      gap: 12px;
      min-height: 186px;
    }

    .module-card h3, .detail-panel h3, .side-panel h3, .result-panel h3 {
      margin-bottom: 8px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .summary {
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 0;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .tag {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      background: #edf4f2;
      color: #315c57;
      font-size: 12px;
      font-weight: 800;
    }

    .folder-filters {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.9);
    }

    .folder-btn {
      min-height: 34px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px;
      background: #edf4f2;
      color: #315c57;
      font-weight: 900;
    }

    .folder-btn:hover,
    .folder-btn.active {
      background: var(--brand);
      color: #fff;
    }

    .record-list {
      display: grid;
      gap: 10px;
    }

    .record {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      text-align: left;
      display: grid;
      gap: 8px;
    }

    .record:hover {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15,118,110,.12);
    }

    .record strong {
      color: var(--ink);
      font-size: 16px;
      line-height: 1.35;
    }

    .record p {
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .record-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: #6b7a80;
      font-size: 12px;
    }

    .detail-panel {
      padding: 20px;
      min-height: 520px;
      position: sticky;
      top: 94px;
    }

    .detail-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .detail-title {
      margin-bottom: 6px;
      font-size: 24px;
      line-height: 1.22;
    }

    .detail-body {
      color: #34454c;
      line-height: 1.75;
    }

    .field-table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      overflow: hidden;
      border-radius: 8px;
      font-size: 14px;
    }

    .field-table th, .field-table td {
      border: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      line-height: 1.55;
    }

    .field-table th {
      width: 116px;
      background: #f0f5f3;
      color: #315c57;
      font-weight: 900;
    }

    .steps {
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .steps li {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
    }

    .step-num {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #dfeeea;
      color: var(--brand-strong);
      font-size: 13px;
      font-weight: 900;
    }

    .result-panel {
      padding: 18px;
      box-shadow: none;
      margin-bottom: 14px;
    }

    mark {
      background: #fde68a;
      color: #2b2111;
      padding: 0 2px;
      border-radius: 3px;
    }

    .empty {
      padding: 26px;
      border: 1px dashed #b9c8c4;
      border-radius: 8px;
      background: rgba(255,255,255,.7);
      text-align: center;
      color: var(--muted);
      line-height: 1.65;
    }

    .hidden { display: none !important; }

    @media (max-width: 1060px) {
      .app { grid-template-columns: 1fr; }
      aside {
        position: relative;
        height: auto;
      }
      nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .workspace, .hero {
        grid-template-columns: 1fr;
      }
      .detail-panel {
        position: static;
        min-height: auto;
      }
    }

    @media (max-width: 680px) {
      main, aside { padding: 16px; }
      .search-bar {
        grid-template-columns: 1fr auto;
      }
      .result-count {
        grid-column: 1 / -1;
        order: 3;
      }
      .module-grid, nav, .metric-grid {
        grid-template-columns: 1fr;
      }
      .intro { padding: 20px; }
      h2 { font-size: 30px; }
      .field-table th {
        width: 92px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="mark">知</div>
        <div>
          <h1>莹烛电商知识库</h1>

    </aside>

    <main>
      <header class="search-bar">
        <div class="search-field">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="搜索产品型号、参数、流程步骤、问题关键词">
        </div>
        <div class="result-count" id="resultCount">共 0 条资料</div>
        <button class="icon-btn" id="clearSearch" type="button" title="清空搜索" aria-label="清空搜索">×</button>
      </header>

      <section class="hero">
        <div class="intro">
          <p class="eyebrow">TRAINING KNOWLEDGE BASE</p>
          <h2>把培训资料变成随查随用的工作台</h2>
          <p>顶部搜索会覆盖四个模块。点击任意条目可查看参数表、流程步骤或 FAQ 详情，并自动记录最近查看；常用资料可以收藏，刷新后仍会保留。</p>
        </div>
        <div class="side-panel">
          <h3>当前资料概览</h3>
          <div class="metric-grid" id="metricGrid"></div>
          <p class="summary">当前内容为示例索引。你提供正式资料后，我会把真实产品参数和工作流程替换进去。</p>
        </div>
      </section>

      <section class="workspace">
        <div class="content-view">
          <div id="moduleView"></div>
          <div id="searchView" class="hidden"></div>
        </div>
        <aside class="detail-panel" id="detailPanel" aria-live="polite"></aside>
      </section>
    </main>
  </div>

  <script src="workflow-data.js"></script>

      { folder: "声光报警器", title: "4G显示屏款声光报警器", pdf: "4G显示屏款声光报警器.pdf" }
    ];

    knowledgeBase.push(...productAssets.map((item, index) => {
      const base = `assets/products/${item.folder}/`;
      const pdfPath = item.pdf ? base + item.pdf : "";
      const wordPath = item.word ? base + item.word : "";
      const productType = item.folder === "YZ太阳能参数" ? "太阳能参数"
        : item.folder === "储能电池" ? "储能电池参数"
        : item.folder === "防爆摄像头彩页" ? "防爆摄像头参数"
        : "声光报警器参数";
      return {
        id: `prd-file-${index + 1}`,
        module: "product",
        title: item.title,
        keywords: ["产品参数", item.folder, productType, item.title, item.pdf || "", item.word || ""].filter(Boolean),
        summary: `${item.folder} 文件夹中的${productType}资料，可查看或下载。`,
        fields: {
          文件夹: item.folder,
          产品类别: productType,
          文件格式: [item.pdf ? "PDF" : "", item.word ? "Word / DOCX" : ""].filter(Boolean).join(" + "),
          查看文件: pdfPath,
          下载文件: pdfPath,
          Word文件: wordPath
        },
        body: `${item.title} 产品参数资料。员工可按文件夹筛选资料；有 PDF 时可直接查看，PDF 和 Word 文件可按需下载给客户或内部使用。`
      };
    }));

    const moduleNav = document.querySelector("#moduleNav");
    const moduleView = document.querySelector("#moduleView");
    const searchView = document.querySelector("#searchView");
    const detailPanel = document.querySelector("#detailPanel");
    const searchInput = document.querySelector("#searchInput");
    const clearSearch = document.querySelector("#clearSearch");
    const resultCount = document.querySelector("#resultCount");
    const metricGrid = document.querySelector("#metricGrid");

    const state = {
      module: localStorage.getItem("kbActiveModule") || "product",
      selected: localStorage.getItem("kbSelectedRecord") || knowledgeBase[0].id,
      favorites: JSON.parse(localStorage.getItem("kbFavorites") || "[]"),
      recent: JSON.parse(localStorage.getItem("kbRecent") || "[]"),
      productFolder: localStorage.getItem("kbProductFolder") || "全部",
      query: ""
    };
    if (!["全部", ...productFolders].includes(state.productFolder)) state.productFolder = "全部";

    function moduleRecords(moduleId) {
      if (moduleId === "saved") return [];
      return knowledgeBase.filter(item => item.module === moduleId);
    }

    function saveState() {
      localStorage.setItem("kbActiveModule", state.module);
      localStorage.setItem("kbSelectedRecord", state.selected);
      localStorage.setItem("kbFavorites", JSON.stringify(state.favorites));
      localStorage.setItem("kbRecent", JSON.stringify(state.recent));
      localStorage.setItem("kbProductFolder", state.productFolder);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function highlight(text, query = state.query) {
      const safe = escapeHtml(text);
      const term = query.trim();
      if (!term) return safe;
      const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return safe.replace(new RegExp(`(${escapedTerm})`, "gi"), "<mark>$1</mark>");
    }

    function searchableText(item) {
      const fieldText = Object.entries(item.fields || {}).flatMap(([key, value]) => {
        if (Array.isArray(value)) return [key, ...value];
        return [key, value];
      }).join(" ");
      return [item.title, item.summary, item.body, item.module, ...(item.keywords || []), fieldText].join(" ").toLowerCase();
    }

    function groupedCounts() {
      return modules.reduce((acc, module) => {
        acc[module.id] = module.id === "saved"
          ? state.favorites.length + state.recent.length
          : moduleRecords(module.id).length;
        return acc;
      }, {});
    }

    function renderNav() {
      const counts = groupedCounts();
      moduleNav.innerHTML = modules.map(module => `
        <button class="nav-btn ${state.module === module.id ? "active" : ""}" type="button" data-module="${module.id}">
          <span class="nav-icon">${module.icon}</span>
          <span>
            <span class="nav-title">${module.title}</span>
            <span class="nav-meta">${module.intro}</span>
          </span>
          <span class="count-pill">${counts[module.id]}</span>
        </button>
      `).join("");
      moduleNav.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.module = btn.dataset.module;
          state.query = "";
          searchInput.value = "";
          render();
        });
      });
    }

    function renderMetrics() {
      const products = moduleRecords("product").length;
      const workflows = moduleRecords("workflow").length;
      const faqs = moduleRecords("faq").length;
      const contracts = moduleRecords("contract").length;
      const reports = moduleRecords("report").length;
      const company = moduleRecords("company").length;
      metricGrid.innerHTML = `
        <div class="metric"><strong>${products}</strong><span>产品参数</span></div>
        <div class="metric"><strong>${workflows}</strong><span>工作流程</span></div>
        <div class="metric"><strong>${faqs}</strong><span>常见问题</span></div>
        <div class="metric"><strong>${contracts}</strong><span>合同模板</span></div>
        <div class="metric"><strong>${reports}</strong><span>检测报告</span></div>
        <div class="metric"><strong>${company}</strong><span>公司信息</span></div>
        <div class="metric"><strong>${state.favorites.length}</strong><span>已收藏</span></div>
      `;
      resultCount.textContent = state.query
        ? `搜索到 ${searchResults().length} 条结果`
        : `共 ${knowledgeBase.length} 条资料`;
    }

    function renderModuleView() {
      const module = modules.find(item => item.id === state.module) || modules[0];
      if (module.id === "saved") {
        renderSavedView(module);
        return;
      }
      const allRecords = moduleRecords(module.id);
      const records = module.id === "product" && state.productFolder !== "全部"
        ? allRecords.filter(item => item.fields?.文件夹 === state.productFolder)
        : allRecords;
      const folderFilters = module.id === "product" ? renderProductFolderFilters(allRecords) : "";
      moduleView.innerHTML = `
        <div class="module-grid">
          <article class="module-card">
            <p class="eyebrow">${module.short.toUpperCase()}</p>
            <h3>${module.title}</h3>
            <p class="summary">${module.intro}</p>
            <div class="tag-row">
              <span class="tag">${records.length} 条资料</span>
              <span class="tag">全站可搜索</span>
            </div>
          </article>
          ${folderFilters}
          ${records.map(renderRecordButton).join("")}
        </div>
      `;
      bindProductFolderButtons(moduleView);
      bindRecordButtons(moduleView);
    }

    function renderProductFolderFilters(records) {
      const folders = ["全部", ...productFolders];
      return `
        <div class="folder-filters" aria-label="产品参数文件夹筛选">
          ${folders.map(folder => {
            const count = folder === "全部"
              ? records.length
              : records.filter(item => item.fields?.文件夹 === folder).length;
            return `<button class="folder-btn ${state.productFolder === folder ? "active" : ""}" type="button" data-folder="${escapeHtml(folder)}">${escapeHtml(folder)} ${count}</button>`;
          }).join("")}
        </div>
      `;
    }

    function bindProductFolderButtons(scope) {
      scope.querySelectorAll(".folder-btn").forEach(button => {
        button.addEventListener("click", () => {
          state.productFolder = button.dataset.folder;
          render();
        });
      });
    }

    function renderSavedView(module) {
      const favorites = state.favorites.map(findRecord).filter(Boolean);
      const recent = state.recent.map(findRecord).filter(Boolean);
      moduleView.innerHTML = `
        <div class="module-grid">
          <article class="module-card">
            <p class="eyebrow">${module.short.toUpperCase()}</p>
            <h3>${module.title}</h3>
            <p class="summary">${module.intro}</p>
            <div class="tag-row">
              <span class="tag">${favorites.length} 个收藏</span>
              <span class="tag">${recent.length} 个最近查看</span>
            </div>
          </article>
          <article class="module-card">
            <h3>资料整理规则</h3>
            <p class="summary">Excel 会整理为产品参数表；Word/PDF 会整理为流程步骤或 FAQ。正式资料接入后，这里会成为高频资料入口。</p>
          </article>
        </div>
        <div class="result-panel">
          <h3>我的收藏</h3>
          <div class="record-list">${favorites.length ? favorites.map(renderRecordButton).join("") : `<div class="empty">还没有收藏。打开资料详情后点击星标即可保存。</div>`}</div>
        </div>
        <div class="result-panel">
          <h3>最近查看</h3>
          <div class="record-list">${recent.length ? recent.map(renderRecordButton).join("") : `<div class="empty">查看过的资料会自动显示在这里。</div>`}</div>
        </div>
      `;
      bindRecordButtons(moduleView);
    }

    function renderRecordButton(item) {
      const module = modules.find(module => module.id === item.module);
      const actionLabel = item.module === "workflow" ? `<span class="record-action">查看流程</span>` : "";
      const favored = state.favorites.includes(item.id) ? "★" : "☆";
      return `
        <button class="record" type="button" data-id="${item.id}">
          <span class="record-meta"><span>${module.title}</span><span>${favored}</span></span>
          <strong>${highlight(item.title)}</strong>
          <p>${highlight(item.summary)}</p>
          <span class="tag-row">${item.keywords.slice(0, 4).map(keyword => `<span class="tag">${highlight(keyword)}</span>`).join("")}</span>
          ${actionLabel}
        </button>
      `;
    }

    function bindRecordButtons(scope) {
      scope.querySelectorAll(".record").forEach(button => {
        button.addEventListener("click", () => selectRecord(button.dataset.id));
      });
    }

    function findRecord(id) {
      return knowledgeBase.find(item => item.id === id);
    }

    function selectRecord(id) {
      const item = findRecord(id);
      if (!item) return;
      state.selected = id;
      state.recent = [id, ...state.recent.filter(itemId => itemId !== id)].slice(0, 6);
      saveState();
      if (item.module === "workflow") {
        window.location.href = `workflow-detail.html?id=${encodeURIComponent(item.id)}`;
        return;
      }
      renderDetail();
      renderNav();
      renderMetrics();
    }

    function toggleFavorite(id) {
      state.favorites = state.favorites.includes(id)
        ? state.favorites.filter(itemId => itemId !== id)
        : [id, ...state.favorites];
      saveState();
      render();
    }

    function renderFields(item) {
      const entries = Object.entries(item.fields || {}).filter(([key]) => key !== "steps" && key !== "下载文件" && key !== "查看文件" && key !== "Word文件");
      if (!entries.length) return "";
      return `
        <table class="field-table">
          <tbody>
            ${entries.map(([key, value]) => `<tr><th>${escapeHtml(key)}</th><td>${highlight(value)}</td></tr>`).join("")}
          </tbody>
        </table>
      `;
    }

    function renderFileActions(item) {
      const viewHref = item.fields?.查看文件 || (item.module === "report" ? item.fields?.下载文件 : "");
      const downloadHref = item.fields?.下载文件;
      const wordHref = item.fields?.Word文件;
      if (!viewHref && !downloadHref && !wordHref) return "";
      const downloadLabel = item.module === "report" ? "下载检测报告" : item.module === "company" ? "下载资料" : item.module === "product" ? "下载PDF" : "下载模板";
      const viewLabel = item.module === "report" ? "查看资料" : item.module === "company" || item.module === "product" ? "查看资料" : "查看文件";
      const downloadName = downloadHref ? downloadHref.split("/").pop() : "";
      const wordName = wordHref ? wordHref.split("/").pop() : "";
      return `
        <div class="file-actions">
          ${viewHref ? `<a class="view-btn" href="${escapeHtml(viewHref)}" target="_blank" rel="noopener"> ${viewLabel}</a>` : ""}
          ${downloadHref ? `<a class="download-btn" href="${escapeHtml(downloadHref)}" download="${escapeHtml(downloadName)}">${downloadLabel}</a>` : ""}
          ${wordHref ? `<a class="view-btn" href="${escapeHtml(wordHref)}" download="${escapeHtml(wordName)}">下载Word</a>` : ""}
        </div>
      `;
    }

    function renderSteps(item) {
      const steps = item.fields?.steps || [];
      if (!steps.length) return "";
      return `
        <h3>流程步骤</h3>
        <ol class="steps">
          ${steps.map((step, index) => `<li><span class="step-num">${index + 1}</span><span>${highlight(step)}</span></li>`).join("")}
        </ol>
      `;
    }

    function renderDetail() {
      const item = findRecord(state.selected) || knowledgeBase[0];
      const module = modules.find(module => module.id === item.module);
      const favoriteLabel = state.favorites.includes(item.id) ? "★ 已收藏" : "☆ 收藏";
      detailPanel.innerHTML = `
        <div class="detail-head">
          <div>
            <p class="eyebrow">${module.title}</p>
            <h3 class="detail-title">${highlight(item.title)}</h3>
          </div>
          <button class="text-btn" type="button" id="favoriteBtn">${favoriteLabel}</button>
        </div>
        <p class="summary">${highlight(item.summary)}</p>
        ${renderFields(item)}
        ${renderFileActions(item)}
        <div class="detail-body">${highlight(item.body)}</div>
        ${renderSteps(item)}
        <div class="tag-row" style="margin-top:16px;">
          ${item.keywords.map(keyword => `<span class="tag">${highlight(keyword)}</span>`).join("")}
        </div>
      `;
      document.querySelector("#favoriteBtn").addEventListener("click", () => toggleFavorite(item.id));
    }

    function searchResults() {
      const query = state.query.trim().toLowerCase();
      if (!query) return [];
      return knowledgeBase.filter(item => searchableText(item).includes(query));
    }

    function renderSearchView() {
      const results = searchResults();
      const grouped = modules
        .filter(module => module.id !== "saved")
        .map(module => ({ module, records: results.filter(item => item.module === module.id) }))
        .filter(group => group.records.length);

      searchView.innerHTML = results.length ? grouped.map(group => `
        <section class="result-panel">
          <h3>${group.module.title} <span class="tag">${group.records.length} 条</span></h3>
          <div class="record-list">${group.records.map(renderRecordButton).join("")}</div>
        </section>
      `).join("") : `<div class="empty">没有找到匹配资料。可以尝试产品型号、流程场景、岗位或同义关键词。</div>`;
      bindRecordButtons(searchView);
    }

    function render() {
      renderNav();
      renderMetrics();
      renderDetail();
      if (state.query.trim()) {
        moduleView.classList.add("hidden");
        searchView.classList.remove("hidden");
        renderSearchView();
      } else {
        searchView.classList.add("hidden");
        moduleView.classList.remove("hidden");
        renderModuleView();
      }
      saveState();
    }

    searchInput.addEventListener("input", () => {
      state.query = searchInput.value;
      render();
    });

    clearSearch.addEventListener("click", () => {
      state.query = "";
      searchInput.value = "";
      render();
      searchInput.focus();
    });

    if (findRecord(state.selected)?.module === "workflow") {
      state.selected = knowledgeBase.find(item => item.module !== "workflow").id;
    }
    render();
  </script>
</body>
</html>
